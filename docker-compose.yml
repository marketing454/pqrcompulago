services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqr_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8085}:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SITE_URL: ${SITE_URL:-http://localhost:8085}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pqr_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-pqr_db}
      UPLOAD_DIR: /var/lib/pqr/uploads
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_SECURE: ${SMTP_SECURE:-tls}
      SMTP_PASS: ${RESEND_API_KEY:?RESEND_API_KEY must be set in .env}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:?MAIL_FROM_EMAIL must be set in .env}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Compulago Atencion}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-soporte@compulago.com}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v17.0}
    volumes:
      - uploads_data:/var/lib/pqr/uploads
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: pqr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${DB_NAME:-pqr_db}
      MYSQL_USER: ${DB_USER:-pqr_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
  uploads_data:
